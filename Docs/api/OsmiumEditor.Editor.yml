  namespace: OsmiumEditor
  syntax:
    content: public const string GlobalUsage = "//-------------------------- READ ME --------------------------\n// THIS IS AN AUTO-GENERATED FILE! EDITING THIS IS OK, BUT\n// BE SURE YOU KNOW WHAT YOU ARE DOING, THE AVERAGE USER HAS NO REASON TO BE HERE\n//-------------------------------------------------------------\n\n//Automatically references OsmiumNucleus to make life easier!\nglobal using OsmiumNucleus;\nglobal using OsmiumBedrock;\n\n//Most IDES will automatically add this file to avoid redundant usage statements for obvious libraries\n//this is added to match the user experience of most IDES\nglobal using System;\nglobal using System.Collections.Generic;\nglobal using System.IO;\nglobal using System.Linq;\nglobal using System.Net.Http;\nglobal using System.Threading;\nglobal using System.Threading.Tasks;\n\n//The word IEnumerator can be confusing for beginners! Coroutine is cleaner and more readable\nglobal using Coroutine = System.Collections.Generic.IEnumerator<OsmiumNucleus.ICoroutineAction>;"
    return:
      type: System.String
    content.vb: Public Const GlobalUsage As String = "//-------------------------- READ ME --------------------------" & vbLf & "// THIS IS AN AUTO-GENERATED FILE! EDITING THIS IS OK, BUT" & vbLf & "// BE SURE YOU KNOW WHAT YOU ARE DOING, THE AVERAGE USER HAS NO REASON TO BE HERE" & vbLf & "//-------------------------------------------------------------" & vbLf & vbLf & "//Automatically references OsmiumNucleus to make life easier!" & vbLf & "global using OsmiumNucleus;" & vbLf & "global using OsmiumBedrock;" & vbLf & vbLf & "//Most IDES will automatically add this file to avoid redundant usage statements for obvious libraries" & vbLf & "//this is added to match the user experience of most IDES" & vbLf & "global using System;" & vbLf & "global using System.Collections.Generic;" & vbLf & "global using System.IO;" & vbLf & "global using System.Linq;" & vbLf & "global using System.Net.Http;" & vbLf & "global using System.Threading;" & vbLf & "global using System.Threading.Tasks;" & vbLf & vbLf & "//The word IEnumerator can be confusing for beginners! Coroutine is cleaner and more readable" & vbLf & "global using Coroutine = System.Collections.Generic.IEnumerator<OsmiumNucleus.ICoroutineAction>;"
