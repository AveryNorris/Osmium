    path: ../Osmium-Nucleus/Source/Overhead/Osmium/Editor.cs
    startLine: 11
  assemblies:
  - Osmium-Nucleus
  namespace: OsmiumNucleus
  summary: Initializes the Context and marks Osmium as initialized; but does not Resolve types
  remarks: >-
    This is part of the Editor pipeline! It has no error checking, and it is made explicitly for Radium! So don't use it unless you know what you are doing.
       These methods are made required in order to use Virtualization! Use Editor Methods instead of normal ones for Virtualization to work.
  example: []
